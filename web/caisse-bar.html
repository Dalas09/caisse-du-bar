<title>Caisse du Bar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen phone app, top bar + scrolling view + fixed bottom tab bar; amber "bottle label" accent on warm ink neutrals */
:root{
  --bg:#f6f3ee; --surface:#fffdf9; --surface2:#efe9df; --line:#ddd3c4;
  --fg:#231c14; --muted:#75685a; --accent:#c8780a; --accent-ink:#ffffff; --accent-soft:#f6e4c4;
  --good:#2f7d4f; --good-soft:#dcefe2; --bad:#b3352a; --bad-soft:#f6dcd8; --warn:#9a6a00; --warn-soft:#f7ecc9;
  --paper:#ffffff; --paper-ink:#1d1d1d;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17130f; --surface:#211b16; --surface2:#2b241d; --line:#3d3329;
  --fg:#f3ece2; --muted:#a8998a; --accent:#f0a030; --accent-ink:#1d1406; --accent-soft:#4a3414;
  --good:#6cc48d; --good-soft:#1e3a29; --bad:#f0897d; --bad-soft:#4a221e; --warn:#e8c25a; --warn-soft:#3d3214;
  --paper:#fbfaf7; --paper-ink:#1d1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --surface:#211b16; --surface2:#2b241d; --line:#3d3329;
  --fg:#f3ece2; --muted:#a8998a; --accent:#f0a030; --accent-ink:#1d1406; --accent-soft:#4a3414;
  --good:#6cc48d; --good-soft:#1e3a29; --bad:#f0897d; --bad-soft:#4a221e; --warn:#e8c25a; --warn-soft:#3d3214;
  --paper:#fbfaf7; --paper-ink:#1d1d1d; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px 8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.role{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.role.admin{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.off{background:var(--warn)}
main{flex:1;overflow-y:auto;padding:4px 16px 16px;min-height:0}
nav.tabs{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 0 10px;font-size:11px;min-width:0;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="true"]{color:var(--accent)}
.badge-n{background:var(--accent);color:var(--accent-ink);border-radius:9px;font-size:10px;padding:0 5px;margin-left:2px}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:8px 0 10px;text-wrap:balance}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px;font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;min-height:96px}
.prod:active{transform:scale(.97)}
.prod .nm{font-weight:700;font-size:15px;line-height:1.2}
.prod .pr{margin-top:auto;font-family:var(--f-display);font-weight:800;font-size:18px}
.prod .eu{font-size:12px;color:var(--muted)}
.prod .st{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:var(--surface2);color:var(--muted)}
.prod .st.low{background:var(--warn-soft);color:var(--warn)} .prod .st.out{background:var(--bad-soft);color:var(--bad)}
.prod .qty{position:absolute;top:-6px;left:-6px;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:999px;min-width:24px;height:24px;display:grid;place-items:center;font-size:13px;padding:0 6px}
.cartbar{position:sticky;bottom:0;margin:12px -16px -16px;padding:10px 16px;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.cartbar .tot{flex:1;min-width:0}
.cartbar .tot b{font-family:var(--f-display);font-size:22px;display:block}
.cartbar .tot span{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--surface2);color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .main b{display:block;font-weight:600}
.li .main small{color:var(--muted)}
.li .right{text-align:right;white-space:nowrap}
button.li{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left}
button.li:first-child{border-top:0}
.pill{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)} .pill.low{background:var(--warn-soft);color:var(--warn)} .pill.out{background:var(--bad-soft);color:var(--bad)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);font-weight:800;font-size:17px;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi.big{grid-column:1/-1;background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kpi .l{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi.big .l{color:inherit;opacity:.7}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:22px;margin-top:2px}
.kpi.big .v{font-size:32px}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.big .s{color:inherit;opacity:.75}
.kpi .v.neg{color:var(--bad)} .kpi .v.pos{color:var(--good)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.period{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.period b{font-family:var(--f-display);font-size:17px;text-align:center;flex:1}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px 6px;margin-top:10px}
.chart svg{display:block;width:100%;height:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted);background:var(--surface2);border-radius:12px;padding:10px 12px;margin:10px 0}
.svc{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.svcrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;font-size:14px}
.svcrow .main{flex:1;min-width:0}
.svc>.btn{align-self:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.form{display:grid;gap:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,8,5,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.sheet .close{float:right;background:var(--surface2);border:0;border-radius:999px;width:34px;height:34px;font-size:18px}
/* receipt */
.receipt{background:var(--paper);color:var(--paper-ink);font-family:var(--f-mono);font-size:13px;padding:18px 16px 22px;margin:4px auto 14px;max-width:320px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.18);
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;padding-bottom:26px}
.receipt .c{text-align:center}
.receipt .t{font-weight:600;font-size:16px;letter-spacing:.05em}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt .r span:first-child{min-width:0}.receipt .r span:last-child{white-space:nowrap}
.receipt .tt{font-weight:600;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;max-width:90%;text-align:center}
.cash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}.prod:active{transform:none}}
</style>

<div class="app">
  <header class="top">
    <h1 class="brand" id="brand">Caisse du Bar</h1>
    <div class="hd-right"><button class="role" id="rolebtn" data-act="role">Serveur</button>
    <div class="sync" id="sync"><span class="dot"></span><span>Chargement…</span></div></div>
  </header>
  <main id="view"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="caisse"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M7 7V4h10v3M7 12h4M7 16h10"/></svg>Caisse</button>
    <button data-tab="tables"><svg viewBox="0 0 24 24"><path d="M4 9h16M6 9v10M18 9v10M8 5h8"/></svg><span>Tables<span id="tabcount"></span></span></button>
    <button data-tab="stock"><svg viewBox="0 0 24 24"><path d="M9 3h6v4l2 3v10a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10l2-3z"/><path d="M7 14h10"/></svg>Stock</button>
    <button data-tab="chiffres"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Chiffres</button>
    <button data-tab="loc"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>Locations</button>
    <button data-tab="plus"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Réglages</button>
  </nav>
</div>
<div id="modal" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
const RATE = 655.957; // 1 € = 655,957 FCFA (parité fixe)
const LS_KEY = "caisse-bar.v1";
const COLLS = ["products","tickets","tabs","moves","charges","settings","apparts","locations","shifts"];
const CATS = ["Bières","Boosters & mix","Jus","Alcools","Vins"];

// Carte du bar fournie par le gérant (prix de vente en FCFA). Utilisée par le bouton "Installer la carte".
const CARTE = [
  ["Grande Régab","Bières",700],["Petite Régab","Bières",500],["33 Export","Bières",700],["Beaufort","Bières",700],
  ["Sombreros","Bières",700],["Doppel","Bières",700],["Guinness","Bières",1000],["Moyenne Heineken","Bières",1300],
  ["Petite Heineken","Bières",1500],["Desperados","Bières",2000],["Régab en canette","Bières",1300],
  ["Grande Royal Dutch","Bières",1500],["Petite Royal Dutch","Bières",1000],["Bavaria","Bières",1200],
  ["Booster Zombie","Boosters & mix",800],["Booster Tropical","Boosters & mix",800],["Booster Whisky cola","Boosters & mix",800],
  ["Booster Gin Tonic","Boosters & mix",800],["Booster Gingembre","Boosters & mix",800],["XXL","Boosters & mix",800],
  ["Smirnoff","Boosters & mix",2000],["Vino cola","Boosters & mix",1000],
  ["Grand jus","Jus",700],["Canette de jus","Jus",800],
  ["Liqueur (dose)","Alcools",2000,3000],["Vodka (dose)","Alcools",2000],["Vin (bouteille)","Vins",5000,10000]
];

/* ---------- application téléphone (impression Bluetooth) ---------- */
const NATIVE = !!window.ReactNativeWebView;
const WINDOWS = NATIVE && window.ReactNativeWebView.platform === "windows"; // programme Windows (Electron)
const native = msg => { try{ window.ReactNativeWebView.postMessage(JSON.stringify(msg)); }catch(e){} };
function getPrinter(){ try{ return JSON.parse(localStorage.getItem("caisse-bar.printer")||"null"); }catch(e){ return null; } }
function setPrinter(p){ try{ localStorage.setItem("caisse-bar.printer", JSON.stringify(p)); }catch(e){} }
window.__fromNative = msg => {
  if(msg.type==="printers"){
    if(!msg.devices.length){ openModal(WINDOWS ? `<h2>Imprimante</h2><p>Aucune imprimante installée dans Windows. Branchez l'imprimante, installez son pilote (Paramètres, puis Bluetooth et appareils, puis Imprimantes), puis revenez ici.</p>`
      : `<h2>Imprimante</h2><p>Aucune imprimante appairée. Allumez l'imprimante, ouvrez les réglages Bluetooth du téléphone et appairez-la (code souvent 0000 ou 1234), puis revenez ici.</p>`); return; }
    openModal(`<h2>Choisir l'imprimante</h2><div class="list">${msg.devices.map(d=>`<button class="li" data-printer="${esc(d.address)}" data-pname="${esc(d.name)}"><div class="main"><b>${esc(d.name||"Sans nom")}</b><small>${esc(d.address)}</small></div></button>`).join("")}</div>`);
  }
  else if(msg.type==="printed"){ toast("Ticket imprimé."); }
  else if(msg.type==="error"){ toast(msg.message || "Impression impossible."); }
  else if(msg.type==="toast"){ toast(msg.message); }
};
window.addEventListener("message", e => { if(e.data && e.data.__fromNative) window.__fromNative(e.data.__fromNative); });
function printTicket(t){
  const p = getPrinter();
  if(!p){ toast("Choisissez d'abord l'imprimante."); native({type:"listPrinters"}); return; }
  const d = new Date(t.ts);
  native({type:"print", address:p.address, ticket:{
    bar: barName(), no: t.no, date: `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`, time: fmtTime(t.ts),
    table: t.table||"", client: t.client||"", items: t.items.map(l=>({qty:l.qty, name:l.name, amount:fcfa(l.price*l.qty)})),
    subtotal: t.discount ? fcfa(t.subtotal) : "", discount: t.discount ? "-" + fcfa(t.discount) : "", total: fcfa(t.total), totalEur: eur(t.total).replace("€","EUR"), pay: t.pay, received: fcfa(t.received), change: t.pay==="Espèces" ? fcfa(t.change) : "",
    cancelled: !!t.cancelled, footer: (S.settings.main||{}).footer || "Merci de votre visite !"}});
  toast("Impression en cours…");
}

/* ---------- utilitaires ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fcfa = n => Math.round(n||0).toLocaleString("fr-FR").replace(/ | /g," ") + " F";
const eur = n => ((n||0)/RATE).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const pad = n => String(n).padStart(2,"0");
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseDay = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const JOURS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const fmtDay = d => `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`;
const fmtTime = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }

/* ---------- rôles : administrateur, gérante (prix d'achat, réductions, annulations), serveur ---------- */
const hashPin = pin => { let h = 5381; const x = "caisse-bar:" + pin; for(let i=0;i<x.length;i++) h = ((h*33) ^ x.charCodeAt(i)) >>> 0; return h.toString(16); };
let role = null; // fixé au démarrage
const DEFAULT_ADMIN_PIN = ""; // empreinte du code de départ, injectée à la construction (secret ADMIN_PIN_HASH) ; vide = à créer au premier lancement
const pins = () => { const m = S.settings.main || {}; return m.adminPin ? m : {...m, adminPin: DEFAULT_ADMIN_PIN}; };
const hasAdminPin = () => !!pins().adminPin;
const canAdmin = () => role === "admin";
const canCost = () => role === "admin" || role === "gest";
const ROLE_NAMES = {admin:"Administrateur", gest:"Gérante", staff:"Serveur"};
let unlocked = false; // vrai seulement après un code correct
function initRole(){ if(!unlocked) role = hasAdminPin() ? "staff" : "admin"; }
function lock(){ if(hasAdminPin() && role !== "staff"){ role = "staff"; unlocked = false; if(tab==="chiffres" || tab==="plus") tab = "caisse"; closeModal(); render(); toast("Application verrouillée."); } }
function showPin(){
  openModal(`<h2>Entrer un code</h2><p style="color:var(--muted)">Code administrateur ou code gérante.</p>
  <div class="form"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Code">
  <button class="btn pri" data-act="unlock">Déverrouiller</button></div>`, {kind:"pin"});
  setTimeout(()=>{ const i=$("#pin"); if(i) i.focus(); }, 50);
}
let idleT;
function bumpIdle(){ clearTimeout(idleT); idleT = setTimeout(lock, 10*60*1000); }

/* ---------- données : cache local + base partagée ---------- */
const S = { products:{}, tickets:{}, tabs:{}, moves:{}, charges:{}, settings:{}, apparts:{}, locations:{}, shifts:{} };
let queue = [];            // écritures en attente (hors ligne)
let db = null, online = false, loaded = false;

function loadLocal(){
  try{
    const raw = localStorage.getItem(LS_KEY); if(!raw) return;
    const o = JSON.parse(raw);
    COLLS.forEach(c => { if(o[c]) S[c] = o[c]; });
    queue = o.queue || [];
  }catch(e){}
}
let saveT;
function saveLocal(){
  clearTimeout(saveT);
  saveT = setTimeout(()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify({...S, queue})); }catch(e){} }, 150);
}
function saveNow(){ clearTimeout(saveT); try{ localStorage.setItem(LS_KEY, JSON.stringify({...S, queue})); }catch(e){} }
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveNow(); });
function applyLocal(op){
  const c = S[op.coll];
  if(op.op === "delete") delete c[op.id];
  else if(op.op === "set") c[op.id] = op.data;
  else c[op.id] = {...(c[op.id]||{}), ...op.data};
}
async function push(op){
  const ref = db.doc(op.coll + "/" + op.id);
  if(op.op === "delete") return ref.delete();
  if(op.op === "set") return ref.set(op.data);
  try{ return await ref.update(op.data); }

}
let flushing = false;

  if(!db || flushing || !queue.length) { setSync(); return; }

    try{ await push(queue[0]); queue.shift(); saveLocal(); }
    catch(e){
      if(e && (e.code === "invalid_argument" || e.code === "transform_error")){ queue.shift(); saveLocal(); continue; }
      online = false; break;
    }
  }
  flushing = false; setSync();
}
function write(op, coll, id, data){
  const o = {op, coll, id, data: data ? JSON.parse(JSON.stringify(data)) : undefined};

/* ---------- synchronisation entre téléphones (Supabase), hors artifact ---------- */
const SYNC_URL = "", SYNC_ANON = ""; // injectés à la construction (build-html.js) ; vides = synchronisation indisponible
const SYNC_LS = "caisse-bar.sync", SYNCQ_LS = "caisse-bar.syncq", SYNCLAST_LS = "caisse-bar.synclast";
const lsGet = (k, d) => { try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } };
const lsSet = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
function syncCfg(){ const c = lsGet(SYNC_LS, null); return c && c.bar && SYNC_URL ? c : null; }
let syncQ = lsGet(SYNCQ_LS, []), syncErr = false, syncBusy = false;
function syncEnqueue(coll, id, deleted){
  if(db || !syncCfg()) return;
  syncQ = syncQ.filter(x => !(x.coll === coll && x.id === id));
  syncQ.push({coll, id, deleted: !!deleted}); lsSet(SYNCQ_LS, syncQ); setTimeout(syncFlush, 300);
}
function syncHeaders(c){ // ancienne clé « anon » (JWT) : aussi en Authorization ; nouvelle clé « publishable » : apikey seulement
  const h = {"apikey": SYNC_ANON, "x-bar-key": c.bar, "Content-Type": "application/json"};
  if(SYNC_ANON.startsWith("eyJ")) h.Authorization = "Bearer " + SYNC_ANON; return h; }
async function syncFlush(){
  const c = syncCfg(); if(!c || syncBusy) return;
  syncBusy = true;
  try{
    while(syncQ.length){
      const batch = syncQ.slice(0, 200);
      const rows = batch.map(x => ({bar: c.bar, coll: x.coll, id: x.id, deleted: x.deleted || !S[x.coll][x.id], data: x.deleted ? null : (S[x.coll][x.id] || null)}));
      const r = await fetch(`${SYNC_URL}/rest/v1/caisse_docs?on_conflict=bar,coll,id`, {method:"POST", headers:{...syncHeaders(c), "Prefer":"resolution=merge-duplicates,return=minimal"}, body: JSON.stringify(rows)});
      if(!r.ok) throw new Error("HTTP " + r.status);
      syncQ = syncQ.slice(batch.length); lsSet(SYNCQ_LS, syncQ);
    }
    syncErr = false;
  }catch(e){ syncErr = true; }
  syncBusy = false; setSync();
}
async function syncPull(){
  const c = syncCfg(); if(!c || document.hidden) return;
  try{
    let since = lsGet(SYNCLAST_LS, "1970-01-01T00:00:00Z"), changed = false, more = true;
    // marge d'une minute : une ligne validée en retard n'est pas perdue (réappliquer est sans effet)
    let from = new Date(new Date(since).getTime() - 60000).toISOString();
    while(more){
      const r = await fetch(`${SYNC_URL}/rest/v1/caisse_docs?select=coll,id,data,deleted,updated_at&bar=eq.${encodeURIComponent(c.bar)}&updated_at=gt.${encodeURIComponent(from)}&order=updated_at.asc&limit=1000`, {headers: syncHeaders(c)});
      if(!r.ok) throw new Error("HTTP " + r.status);
      const rows = await r.json();
      rows.forEach(row => {
        if(!S[row.coll] || syncQ.some(x => x.coll === row.coll && x.id === row.id)) return;
        if(row.deleted) delete S[row.coll][row.id]; else S[row.coll][row.id] = row.data;
        changed = true; if(row.updated_at > since) since = row.updated_at;
      });
      more = rows.length === 1000; if(more) from = rows[rows.length-1].updated_at;
    }
    lsSet(SYNCLAST_LS, since); syncErr = false;
    if(changed){ saveLocal(); render(); }
  }catch(e){ syncErr = true; }
  setSync();
}
function newBarKey(){ const a = new Uint8Array(15); crypto.getRandomValues(a); return Array.from(a, b => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b % 32]).join("").replace(/(.{5})(?=.)/g, "$1-"); }
function syncStartAll(){ COLLS.forEach(c => Object.keys(S[c]).forEach(id => syncQ.push({coll:c, id, deleted:false}))); lsSet(SYNCQ_LS, syncQ); syncFlush().then(syncPull); }

function setSync(){
  const el = $("#sync");
  let cls="", txt;
  const sc = syncCfg();
  if(!db && sc){ cls = syncQ.length || syncErr ? "off" : "ok"; txt = syncErr ? "Hors ligne" + (syncQ.length?` · ${syncQ.length} en attente`:"") : syncQ.length ? `${syncQ.length} à envoyer` : "Synchronisé"; }
  else if(!db){ cls="off"; txt=WINDOWS ? "Sur cet ordinateur" : "Sur ce téléphone"; }
  else if(queue.length){ cls="off"; txt=`${queue.length} en attente`; }
  else { cls="ok"; txt="Enregistré"; }
  el.innerHTML = `<span class="dot ${cls}"></span><span>${txt}</span>`;
}
function subscribe(){
  const since = dayKey(addDays(new Date(), -100));
  const queries = {
    products: db.collection("products"), tabs: db.collection("tabs"), settings: db.collection("settings"),
    charges: db.collection("charges").where("day",">=",since), moves: db.collection("moves").where("day",">=",since),
    tickets: db.collection("tickets").where("day",">=",since),
    apparts: db.collection("apparts"), locations: db.collection("locations"),
    shifts: db.collection("shifts").where("day",">=",since)
  };
  Object.entries(queries).forEach(([coll,q])=>{
    q.onSnapshot(snap=>{
      const m = {}; snap.docs.forEach(d=>{ m[d.id] = d.data(); });
      // garder les données plus anciennes déjà chargées (tickets hors fenêtre) et les écritures en attente
      if(coll === "tickets" || coll === "charges" || coll === "moves" || coll === "shifts"){
        Object.entries(S[coll]).forEach(([id,v])=>{ if(v.day < since) m[id] = v; });
      }
      S[coll] = m;
      queue.filter(o=>o.coll===coll).forEach(applyLocal);
      online = true; loaded = true; saveLocal(); setSync(); render();
    }, err=>{ setSync(); });
  });
}

function stats(from,to){

  const tks = Object.entries(S.tickets).map(([id,t])=>({id,...t})).filter(t=>t.day>=a && t.day<=b && !t.cancelled).sort((x,y)=>x.ts-y.ts);
  const ch = Object.values(S.charges).filter(c=>c.day>=a && c.day<=b && c.scope!=="appart");
  let ca=0, cost=0, costKnown=true; const byProd={};
  tks.forEach(t=>{ ca+=t.total; (t.items||[]).forEach(l=>{

function barChart(bars){
  const W=340,H=150,padL=4,padB=20,padT=16; const max=Math.max(1,...bars.map(b=>b.v));
  const bw=(W-padL*2)/bars.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d'affaires par jour">`;
  s+=`<line x1="0" x2="${W}" y1="${H-padB}" y2="${H-padB}" stroke="var(--line)"/>`;
  const every = bars.length>16 ? 5 : 1;
  bars.forEach((b,i)=>{
    const h=(H-padB-padT)*b.v/max, x=padL+i*bw+bw*.15, w=bw*.7, y=H-padB-h;
    s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,b.v?1.5:0).toFixed(1)}" rx="2" fill="${b.cur?"var(--accent)":"var(--muted)"}" opacity="${b.cur?1:.55}"/>`;
    if(i%every===0 || b.cur) s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-5}" font-size="10" text-anchor="middle" fill="var(--muted)" font-family="var(--f-body)">${esc(b.l)}</text>`;
  });
  const mi = bars.reduce((m,b,i)=>b.v>bars[m].v?i:m,0);
  if(bars[mi].v>0){ const x=padL+mi*bw+bw/2; s+=`<text x="${Math.min(Math.max(x,30),W-30).toFixed(1)}" y="11" font-size="10" text-anchor="middle" fill="var(--fg)" font-weight="700" font-family="var(--f-body)">${esc(fcfa(bars[mi].v))}</text>`; }
  return s+`</svg>`;
}

const nightsBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 86400000);
function rentPrice(ap, nights){
  const base = (ap.dayPrice||0) * nights;
  const pct = nights >= 30 ? (ap.monthDisc||0) : nights >= 7 ? (ap.weekDisc||0) : 0;
  return {base, pct, auto: Math.round(base*pct/100)};
}
function nightsIn(l, from, to){ // nuits de la location qui tombent dans la période [from, to]
  const a = l.start > dayKey(from) ? l.start : dayKey(from);
  const endIncl = dayKey(addDays(parseDay(l.end), -1)); const b = endIncl < dayKey(to) ? endIncl : dayKey(to);
  return b < a ? 0 : nightsBetween(a, b) + 1;
}
const apparts = () => Object.entries(S.apparts).map(([id,a])=>({id,...a})).filter(a=>!a.hidden).sort((x,y)=>x.name.localeCompare(y.name));
const locs = () => Object.entries(S.locations).map(([id,l])=>({id,...l})).filter(l=>!l.cancelled);
function locStats(from, to){
  const a = dayKey(from), z = dayKey(to); let ca = 0, nights = 0;
  locs().forEach(l => { const n = nightsIn(l, from, to); if(n){ ca += l.total * n / l.nights; nights += n; } });
  const ch = Object.values(S.charges).filter(c=>c.day>=a && c.day<=z && c.scope==="appart");
  const charges = ch.reduce((s,c)=>s+(+c.amount||0),0);
  const days = nightsBetween(a, z) + 1, nb = apparts().length;
  return {ca: Math.round(ca), nights, charges, ch, occ: nb ? Math.round(nights / (nb*days) * 100) : 0};
}
function viewLoc(){
  const {from,to,label} = periodRange(); const st = locStats(from,to); const aps = apparts(); const today = dayKey(new Date());
  let h = `<h2>Locations</h2>`;
  if(!aps.length) return h + `<div class="empty"><p><b>Aucun logement pour l'instant.</b></p>${canAdmin()?`<p>Ajoutez vos appartements avec leur prix à la nuit et leurs réductions.</p><button class="btn pri" data-act="newappart">Ajouter un logement</button>`:`<p>Demandez à l'administrateur d'ajouter les logements.</p>`}</div>`;
  h += `<button class="btn pri wide" data-act="newloc">Nouvelle location</button>
  <div class="seg" style="margin-top:14px">${["jour","semaine","mois"].map(m=>`<button data-mode="${m}" aria-pressed="${period.mode===m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}</div>
  <div class="period"><button class="btn sm ghost" data-shift="-1" aria-label="Période précédente">‹</button><b>${esc(label)}</b><button class="btn sm ghost" data-shift="1" aria-label="Période suivante">›</button></div>
  <div class="kpis">
    <div class="kpi big"><div class="l">Bénéfice net des locations</div><div class="v num">${fcfa(st.ca - st.charges)}</div><div class="s num">${eur(st.ca - st.charges)}</div></div>
    <div class="kpi"><div class="l">Loyers</div><div class="v num">${fcfa(st.ca)}</div><div class="s num">${st.nights} nuit${st.nights>1?"s":""}</div></div>
    <div class="kpi"><div class="l">Charges</div><div class="v num">${fcfa(st.charges)}</div><div class="s num">Occupation ${st.occ} %</div></div>
  </div>
  <p class="note">Les loyers sont comptés nuit par nuit : une location d'un mois compte pour chaque jour du mois.</p>`;
  const cur = locs().filter(l=>l.end > today).sort((x,y)=>x.start.localeCompare(y.start));
  h += `<h3>En cours et à venir</h3>` + (cur.length ? `<div class="list">${cur.map(l=>{ const ap=S.apparts[l.appart]||{name:"?"}; const now=l.start<=today;
    return `<button class="li" data-locopen="${l.id}"><div class="main"><b>${esc(ap.name)} · ${esc(l.client||"Client")}</b><small>${fmtDay(parseDay(l.start))} → ${fmtDay(parseDay(l.end))} · ${l.nights} nuit${l.nights>1?"s":""}</small></div>
    <div class="right"><b class="num">${fcfa(l.total)}</b><br><span class="pill ${l.paid>=l.total?"ok":"low"}">${l.paid>=l.total?"Payée":now?"En cours · à payer":"À payer"}</span></div></button>`; }).join("")}</div>` : `<div class="note">Aucune location en cours.</div>`);
  const past = locs().filter(l=>l.end <= today && nightsIn(l,from,to)).sort((x,y)=>y.start.localeCompare(x.start));
  if(past.length) h += `<h3>Terminées sur la période</h3><div class="list">${past.map(l=>`<button class="li" data-locopen="${l.id}"><div class="main"><b>${esc((S.apparts[l.appart]||{}).name||"?")} · ${esc(l.client||"Client")}</b><small>${fmtDay(parseDay(l.start))} → ${fmtDay(parseDay(l.end))}</small></div><div class="right num">${fcfa(l.total)}${l.paid<l.total?`<br><span class="pill low">Reste ${fcfa(l.total-l.paid)}</span>`:""}</div></button>`).join("")}</div>`;
  h += `<h3>Charges des logements</h3><div class="note">Eau, électricité, internet, ménage, entretien… déduites du bénéfice des locations.</div>
  <button class="btn wide" data-act="addlcharge">Ajouter une charge de logement</button>`;
  if(st.ch.length) h += `<div class="list" style="margin-top:10px">${st.ch.sort((x,y)=>y.day.localeCompare(x.day)).map(c=>`<div class="li"><div class="main"><b>${esc(c.label)}</b><small>${fmtDay(parseDay(c.day))}${c.appart&&S.apparts[c.appart]?" · "+esc(S.apparts[c.appart].name):""}</small></div><div class="right num">${fcfa(c.amount)}</div></div>`).join("")}</div>`;
  h += `<h3>Logements</h3><div class="list">${aps.map(a=>`<button class="li" ${canAdmin()?`data-appedit="${a.id}"`:""}><div class="main"><b>${esc(a.name)}</b><small class="num">${a.weekDisc?`−${a.weekDisc} % à la semaine`:""}${a.weekDisc&&a.monthDisc?" · ":""}${a.monthDisc?`−${a.monthDisc} % au mois`:""}</small></div><div class="right"><b class="num">${fcfa(a.dayPrice)}</b><br><small class="num">la nuit · ${eur(a.dayPrice)}</small></div></button>`).join("")}</div>`;
  if(canAdmin()) h += `<div class="row wrap" style="margin-top:10px"><button class="btn" data-act="newappart">Ajouter un logement</button></div>`;
  return h;
}

function locPreview(){
  const ap = S.apparts[$("#lapp").value]; const st = $("#lstart").value, en = $("#lend").value; const box = $("#lprev");
  if(!ap || !st || !en || en <= st){ box.textContent = "Choisissez le logement et les dates (le départ après l'arrivée)."; modalState.calc = null; return; }
  const n = nightsBetween(st, en); const p = rentPrice(ap, n); const extra = canCost() ? Math.max(0, +($("#lextra").value||0)) : 0;
  const total = Math.max(0, p.base - p.auto - extra);
  const clash = locs().find(l => l.appart === $("#lapp").value && l.id !== modalState.id && l.start < en && l.end > st);
  modalState.calc = {nights:n, base:p.base, pct:p.pct, auto:p.auto, extra, total};
  box.innerHTML = `${n} nuit${n>1?"s":""} × ${fcfa(ap.dayPrice)} = ${fcfa(p.base)}${p.pct?`<br>Réduction ${n>=30?"au mois":"à la semaine"} (${p.pct} %) : −${fcfa(p.auto)}`:""}${extra?`<br>Réduction accordée : −${fcfa(extra)}`:""}<br><b style="font-size:18px">Total : ${fcfa(total)}</b> · ${eur(total)}${clash?`<br><span style="color:var(--bad)">Attention : ce logement est déjà loué à ${esc(clash.client||"un client")} sur ces dates.</span>`:""}`;
}

function viewChiffres(){
  const {from,to,label} = periodRange();
  const st = stats(from,to);
  const n = st.tks.length;
  let h = `<div class="seg">${["jour","semaine","mois"].map(m=>`<button data-mode="${m}" aria-pressed="${period.mode===m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}</div>
  <div class="period"><button class="btn sm ghost" data-shift="-1" aria-label="Période précédente">‹</button><b>${esc(label)}</b><button class="btn sm ghost" data-shift="1" aria-label="Période suivante">›</button></div>
  <div class="kpis">
    <div class="kpi big"><div class="l">Chiffre d'affaires</div><div class="v num">${fcfa(st.ca)}</div><div class="s num">${eur(st.ca)}</div></div>
    <div class="kpi"><div class="l">Tickets</div><div class="v num">${n}</div><div class="s num">Panier moyen ${fcfa(n?st.ca/n:0)}</div></div>
    <div class="kpi"><div class="l">Charges</div><div class="v num">${fcfa(st.charges)}</div><div class="s num">${eur(st.charges)}</div></div>`;
  if(st.costKnown){
    const marge = st.ca-st.cost, res = marge-st.charges;
    h += `<div class="kpi"><div class="l">Marge sur boissons</div><div class="v num">${fcfa(marge)}</div><div class="s num">Achats ${fcfa(st.cost)} · ${st.ca?Math.round(marge/st.ca*100):0} %</div></div>
    <div class="kpi"><div class="l">Bénéfice</div><div class="v num ${res<0?"neg":"pos"}">${fcfa(res)}</div><div class="s num">${eur(res)}</div></div>`;
  }
  h += `</div>`;
  if(n && !st.costKnown) h += `<div class="note">Pour voir la marge et le bénéfice, entrez le prix d'achat de chaque produit dans Réglages, puis Produits et prix.</div>`;
  if(period.mode!=="jour"){
    const bars=[]; const today=dayKey(new Date());
    for(let d=new Date(from); d<=to; d=addDays(d,1)){ const k=dayKey(d);
      bars.push({l: period.mode==="semaine" ? JOURS[d.getDay()].replace(".","") : String(d.getDate()), v: st.tks.filter(t=>t.day===k).reduce((s,t)=>s+t.total,0), cur:k===today}); }
    h += `<div class="chart">${barChart(bars)}</div>`;
  } else if(n){
    const hrs={}; st.tks.forEach(t=>{ const x=new Date(t.ts).getHours(); hrs[x]=(hrs[x]||0)+t.total; });
    const ks=Object.keys(hrs).map(Number); const lo=Math.min(...ks), hi=Math.max(...ks); const bars=[];
    for(let x=lo;x<=hi;x++) bars.push({l:x+"h", v:hrs[x]||0, cur:false});
    h += `<div class="chart">${barChart(bars)}</div>`;
  }
  if(st.top.length) h += `<h3>Ventes par produit</h3><div class="list">${st.top.map(p=>`<div class="li"><div class="main"><b>${esc(p.name)}</b><small class="num">${p.qty} vendu${p.qty>1?"s":""}</small></div><div class="right num">${fcfa(p.ca)}</div></div>`).join("")}</div>`;
  if(canAdmin()){
    const a = dayKey(from), z = dayKey(to);
    const ev = Object.values(S.tickets).filter(t=>t.day>=a && t.day<=z && (t.cancelled || t.discount)).sort((x,y)=>y.ts-x.ts);
    if(ev.length){
      const totDisc = ev.filter(t=>!t.cancelled).reduce((s,t)=>s+(t.discount||0),0), totCanc = ev.filter(t=>t.cancelled).reduce((s,t)=>s+t.total,0);
      h += `<h3>Annulations et réductions</h3><div class="note num">Réductions : ${fcfa(totDisc)} · Tickets annulés : ${fcfa(totCanc)}</div><div class="list">${ev.map(t=>t.cancelled
        ? `<div class="li"><div class="main"><b>Annulé · N° ${esc(t.no)}</b><small>${fmtDay(new Date(t.cancelledAt||t.ts))} ${fmtTime(t.cancelledAt||t.ts)} · par ${esc(ROLE_NAMES[t.cancelledBy]||"?")} · ${esc(t.cancelReason||"sans motif")}</small></div><span class="pill out num">${fcfa(t.total)}</span></div>`
        : `<div class="li"><div class="main"><b>Réduction · N° ${esc(t.no)}</b><small>${fmtDay(new Date(t.ts))} ${fmtTime(t.ts)} · par ${esc(ROLE_NAMES[t.discountBy]||"?")}${t.discountReason?" · "+esc(t.discountReason):""}</small></div><span class="pill low num">−${fcfa(t.discount)}</span></div>`).join("")}</div>`;
    }
  }
  h += shiftSection(from, to);
  if(n) h += `<h3>Tickets</h3><div class="list">${st.tks.slice().reverse().map(t=>`<button class="li" data-ticket="${t.id}"><div class="main"><b>N° ${esc(t.no)}${t.table?" · "+esc(t.table):""}</b><small>${period.mode==="jour"?"":fmtDay(new Date(t.ts))+" · "}${fmtTime(t.ts)} · ${esc(t.pay)}</small></div><div class="right num">${fcfa(t.total)}</div></button>`).join("")}</div>`;
  else h += `<div class="empty">Aucune vente sur cette période.</div>`;
  if(st.ch.length) h += `<h3>Charges de la période</h3><div class="list">${st.ch.map(c=>`<div class="li"><div class="main"><b>${esc(c.label)}</b><small>${fmtDay(parseDay(c.day))}</small></div><div class="right num">${fcfa(c.amount)}</div></div>`).join("")}</div>`;
  return h;
}

         <div class="form"><button class="btn pri" data-act="syncnew">Relier ce téléphone (téléphone de caisse)</button>
         <label class="f">Ou entrez le code de liaison du téléphone de caisse<input id="barkey" autocomplete="off" placeholder="XXXXX-XXXXX-XXXXX"></label>
         <button class="btn" data-act="syncjoin">Rejoindre</button></div>`);
  }
  if(canAdmin()) h += `<h3>Sauvegarde</h3><div class="row wrap"><button class="btn" data-act="export">Exporter les ventes (tableur)</button></div>`;
  if(role!=="staff" && hasAdminPin()) h += `<button class="btn ghost wide" style="margin-top:16px" data-act="lock">Verrouiller (mode Serveur)</button>`;
  return h + `<p class="note">Taux utilisé : 1 € = 655,957 FCFA.</p>`;
}

  const n = Object.values(S.tickets).filter(t=>t.day===day).length + 1;

function confirmPay(){
  const st = modalState; const now = new Date(); const day = dayKey(now);
  const recv = st.mode==="Espèces" ? (+($("#recv").value||0)) : st.total;
  if(st.mode==="Espèces" && recv < st.total){ toast("Le montant reçu est inférieur au total."); return; }
  const id = uid();
  const t = {no: nextTicketNo(day), day, ts: now.getTime(), items: st.items.map(l=>({pid:l.pid,name:l.name,price:l.price,cost:l.cost||0,qty:l.qty})),
    subtotal: st.subtotal, discount: st.discount||0, discountBy: st.discount ? role : null, discountReason: st.discount ? (($("#discreason")||{}).value||"").trim() || null : null,
    total: st.total, pay: st.mode, received: recv, change: recv - st.total, table: st.tabId ? S.tabs[st.tabId].name : null, client: ($("#client").value||"").trim() || null};
  write("set","tickets",id,t);
  decStock(t.items, -1);
  if(st.tabId){
    if(st.partial){
      const left = (S.tabs[st.tabId].items||[]).map(l=>({...l}));
      st.items.forEach(a=>{ const l=left.find(x=>x.pid===a.pid&&x.price===a.price); if(l) l.qty-=a.qty; });
      const rest = left.filter(l=>l.qty>0);
      if(rest.length) write("update","tabs",st.tabId,{items:rest}); else write("delete","tabs",st.tabId);
    } else write("delete","tabs",st.tabId);
  }
  else cart = [];
  render(); showTicket(id, true);
  if(NATIVE){ try{ if(localStorage.getItem("caisse-bar.autoprint")==="1") printTicket(t); }catch(e){} }
}
function decStock(items, sign){
  const by = {}; items.forEach(l=>{ by[l.pid]=(by[l.pid]||0)+l.qty; });
  Object.entries(by).forEach(([pid,q])=>{ const p=S.products[pid]; if(p && p.stock!=null) write("update","products",pid,{stock: p.stock + sign*q}); });
}

async function copyText(txt){
  if(NATIVE){ native({type:"share", text:txt}); return; }
  try{ await navigator.clipboard.writeText(txt); toast("Ticket copié. Collez-le dans WhatsApp ou SMS."); }
  catch(e){ openModal(`<h2>Ticket</h2><p>Sélectionnez le texte puis copiez-le.</p><textarea style="width:100%;height:240px;font-family:var(--f-mono);font-size:13px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px" readonly>${esc(txt)}</textarea>`); }

async function saveFile(filename, data, mime){
  if(NATIVE){ native({type:"share", text:data, filename}); return; }
  try{
    const dl = await claude.use("downloads");
    if(!dl){ toast("L'enregistrement de fichier n'est pas disponible ici."); return; }
    await dl.save({filename, data: new Blob([data],{type:mime})});
  }catch(e){ if(e && e.code!=="cancelled" && e.code!=="declined") toast("Fichier non enregistré."); }
}
function exportCSV(){
  const rows = [["Date","Heure","Ticket","Table","Produit","Quantité","Prix unitaire FCFA","Total FCFA","Total EUR","Prix achat unitaire","Paiement","Annulé"]];
  Object.values(S.tickets).sort((a,b)=>a.ts-b.ts).forEach(t=>t.items.forEach(l=>rows.push([t.day,fmtTime(t.ts),t.no,t.table||"",l.name,l.qty,l.price,l.price*l.qty,((l.price*l.qty)/RATE).toFixed(2).replace(".",","),l.cost||"",t.pay,t.cancelled?"oui":""])));
  const csv = "﻿" + rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  saveFile(`ventes-${dayKey(new Date())}.csv`, csv, "text/csv");
}

    if(S.products[id]) return;

const num = id => { const v = $("#"+id).value; return v==="" ? null : Math.round(+v); };

document.addEventListener("click", e=>{
  const b = e.target.closest("button, [data-scrim]"); if(!b) return;
  if(b.hasAttribute("data-scrim")){ if(e.target===b) closeModal(); return; }
  const d = b.dataset;
  if(d.tab){ tab=d.tab; try{history.replaceState(null,"","#"+tab);}catch(_){} closeModal(); render(); $("#view").scrollTop=0; return; }
  if(d.cat){ cat=d.cat; render(); return; }
  if(d.add){ const p={id:d.add,...S.products[d.add]}; if(p.priceMax) askPrice(p); else addToCart(p,p.price); return; }
  if(d.pickprice){ const p={id:modalState.pid,...S.products[modalState.pid]}; closeModal(); addToCart(p,+d.pickprice); return; }
  if(d.inc!==undefined || d.dec!==undefined){
    const i = +(d.inc ?? d.dec), delta = d.inc!==undefined ? 1 : -1;
    if(modalState && modalState.kind==="tab"){ const t=S.tabs[modalState.id]; const items=t.items.map(l=>({...l})); items[i].qty+=delta; const out=items.filter(l=>l.qty>0); write("update","tabs",modalState.id,{items:out}); showTab(modalState.id); render(); }
    else { cart[i].qty+=delta; cart=cart.filter(l=>l.qty>0); render(); showCart(); }
    return;
  }
  if(d.spinc!==undefined || d.spdec!==undefined){
    const st=modalState, i=+(d.spinc ?? d.spdec), max=S.tabs[st.id].items[i].qty; const c=$("#splitclient").value;
    st.picks[i]=Math.max(0,Math.min(max, st.picks[i]+(d.spinc!==undefined?1:-1))); modalState.client=c; showSplit(st.id, st.picks); return;
  }
  if(d.shiftname!==undefined){ startShift(d.shiftname); return; }
  if(d.shiftend){ const x=S.shifts[d.shiftend]; if(!x) return;
    if(b.dataset.armed){ const now=Date.now(); write("update","shifts",d.shiftend,{end:now}); toast(`Fin de service pour ${x.name} : ${fmtDur(now-x.start)}.`); render(); }
    else { b.dataset.armed="1"; b.textContent="Confirmer la fin"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent="Fin de service"; } }, 5000); }
    return; }
  if(d.shiftedit){ if(canCost()) showShiftEdit(d.shiftedit); return; }
  if(d.locopen){ showLoc(d.locopen); return; }
  if(d.appedit){ if(canAdmin()) showAppartEdit(d.appedit); return; }
  if(d.tabopen){ showTab(d.tabopen); return; }
  if(d.addtotab){ write("update","tabs",d.addtotab,{items: mergeInto(S.tabs[d.addtotab].items||[], cart)}); toast(`Ajouté à ${S.tabs[d.addtotab].name}.`); cart=[]; closeModal(); render(); return; }
  if(d.stk){ showStockEdit(d.stk); return; }
  if(d.edit){ if(canAdmin()) showProdEdit(d.edit); return; }
  if(d.costedit){ if(canCost()) showCostEdit(d.costedit); return; }
  if(d.ticket){ showTicket(d.ticket,false); return; }
  if(d.copyticket){ copyText(ticketText(S.tickets[d.copyticket])); return; }
  if(d.printticket){ printTicket(S.tickets[d.printticket]); return; }
  if(d.printer){ setPrinter({address:d.printer, name:d.pname}); toast(`Imprimante : ${d.pname||d.printer}`); closeModal(); render(); return; }
  if(d.saveticket){ const t=S.tickets[d.saveticket]; saveFile(`ticket-${t.no}.txt`, ticketText(t), "text/plain"); return; }
  if(d.cancelticket){ if(!canCost()) return;
    const reason = ($("#cancelreason").value||"").trim(); if(!reason){ toast("Indiquez le motif de l'annulation."); return; }
    if(b.dataset.armed){ const t=S.tickets[d.cancelticket]; write("update","tickets",d.cancelticket,{cancelled:true, cancelledAt:Date.now(), cancelledBy:role, cancelReason:reason}); decStock(t.items, +1); toast("Ticket annulé, stock remis."); closeModal(); render(); }
    else { b.dataset.armed="1"; b.textContent="Touchez encore pour confirmer l'annulation"; }
    return;
  }
  if(d.delcharge){ if(!canAdmin()) return; write("delete","charges",d.delcharge); render(); return; }
  if(d.mode){ period.mode=d.mode; render(); return; }
  if(d.shift){ const s=+d.shift, r=new Date(period.ref);
    if(period.mode==="jour") r.setDate(r.getDate()+s); else if(period.mode==="semaine") r.setDate(r.getDate()+7*s); else { r.setDate(1); r.setMonth(r.getMonth()+s); }
    period.ref=r; render(); return; }
  if(d.discpct!==undefined){ const v = Math.round(modalState.subtotal*(+d.discpct)/100); $("#disc").value = v||""; setDiscount(v); return; }
  if(d.paymode){ modalState.mode=d.paymode; document.querySelectorAll("[data-paymode]").forEach(x=>x.setAttribute("aria-pressed",x===b)); $("#cashbox").hidden = d.paymode!=="Espèces"; return; }
  if(d.recv){ $("#recv").value=d.recv; updRendu(); return; }
  switch(d.act){
    case "close": closeModal(); break;
    case "role": if(role==="staff") showPin(); else if(hasAdminPin()) lock(); else { tab="plus"; render(); toast("Créez d'abord votre code administrateur."); } break;
    case "lock": lock(); break;
    case "unlock": { const h=hashPin($("#pin").value.trim()); const s=pins();
      if(s.adminPin && h===s.adminPin) role="admin"; else if(s.gestPin && h===s.gestPin) role="gest"; else { toast("Code incorrect."); $("#pin").value=""; return; }
      unlocked = true; closeModal(); bumpIdle(); render(); toast(`Bienvenue, ${ROLE_NAMES[role]}.`); break; }
    case "setadmin": { if(!canAdmin()) return; const v=$("#newadmin").value.trim(); if(!/^\d{4,}$/.test(v)){ toast("Le code doit avoir au moins 4 chiffres."); return; }
      if(pins().gestPin===hashPin(v)){ toast("Choisissez un code différent du code gérante."); return; }
      unlocked = true; write("set","settings","main",{...pins(), adminPin:hashPin(v)}); toast("Code administrateur enregistré. Notez-le bien."); render(); break; }
    case "setgest": { if(!canAdmin()) return; const v=$("#newgest").value.trim(); if(!/^\d{4,}$/.test(v)){ toast("Le code doit avoir au moins 4 chiffres."); return; }
      if(!hasAdminPin()){ toast("Créez d'abord votre code administrateur."); return; }
      if(pins().adminPin===hashPin(v)){ toast("Choisissez un code différent du vôtre."); return; }
      write("set","settings","main",{...pins(), gestPin:hashPin(v)}); toast("Code gérante enregistré."); render(); break; }
    case "delgest": { if(!canAdmin()) return; const n={...pins()}; delete n.gestPin; write("set","settings","main",n); toast("Code gérante supprimé."); render(); break; }
    case "savecost": { if(!canCost()) return; const c=num("ccost"); write("update","products",modalState.pid,{cost:c||null}); toast("Prix d'achat enregistré."); closeModal(); render(); break; }
    case "install": installCarte(); break;
    case "cart": showCart(); break;
    case "pay": showPay(cart,null); break;
    case "confirmpay": confirmPay(); break;
    case "clearcart": cart=[]; closeModal(); render(); break;
    case "totable": showToTable(); break;
    case "newtab": { const name=$("#tabname").value.trim(); if(!name){ toast("Donnez un nom à la table."); return; }
      write("set","tabs",uid(),{name, opened:Date.now(), items:cart}); cart=[]; closeModal(); toast(`${name} ouverte.`); render(); break; }
    case "splittab": showSplit(modalState.id); break;
    case "splitpay": { const st=modalState; const items=S.tabs[st.id].items.map((l,i)=>({...l,qty:st.picks[i]})).filter(l=>l.qty>0);
      showPay(items, st.id, true, $("#splitclient").value.trim()); break; }
    case "paytab": showPay(S.tabs[modalState.id].items||[], modalState.id); break;
    case "addmore": { closeModal(); tab="caisse"; render(); toast(`Choisissez les consommations, puis « Voir » et « Mettre sur une table ».`); break; }
    case "deltab": if(b.dataset.armed){ write("delete","tabs",modalState.id); closeModal(); render(); } else { b.dataset.armed="1"; b.textContent="Touchez encore pour supprimer"; } break;
    case "customprice": { const v=num("customprice"); if(!v){ toast("Entrez un prix."); return; } const p={id:modalState.pid,...S.products[modalState.pid]}; closeModal(); addToCart(p,v); break; }
    case "receive": { const q=num("rqty"), c=canCost()?num("rcost"):null; if(!q){ toast("Entrez la quantité reçue."); return; } const p=S.products[modalState.pid];
      const upd={stock:(p.stock||0)+q}; if(c) upd.cost=c; write("update","products",modalState.pid,upd);
      write("set","moves",uid(),{pid:modalState.pid,name:p.name,type:"recv",qty:q,cost:c||null,ts:Date.now(),day:dayKey(new Date())});
      toast(`+${q} ${p.name}`); closeModal(); render(); break; }
    case "inventory": { const q=num("iqty"), a=num("ialert"); if(q==null){ toast("Entrez la quantité comptée."); return; } const p=S.products[modalState.pid];
      write("update","products",modalState.pid,{stock:q, alert:a??6});
      write("set","moves",uid(),{pid:modalState.pid,name:p.name,type:"inv",qty:q,ts:Date.now(),day:dayKey(new Date())});
      toast("Inventaire enregistré."); closeModal(); render(); break; }
    case "saveprod": { if(!canAdmin()) return; const name=$("#pname").value.trim(), price=num("pprice"); if(!name||!price){ toast("Le nom et le prix sont obligatoires."); return; }
      const data={name,cat:$("#pcat").value,price}; const mx=num("pmax"), c=num("pcost"); data.priceMax = mx && mx>price ? mx : null; data.cost = c||null;
      if(modalState.pid) write("update","products",modalState.pid,data); else write("set","products",uid(),{...data,order:999});
      toast("Produit enregistré."); closeModal(); render(); break; }
    case "hideprod": if(!canAdmin()) return; write("update","products",modalState.pid,{hidden:true}); closeModal(); render(); break;
    case "savebar": if(!canAdmin()) return; write("set","settings","main",{...(S.settings.main||{}), barName:$("#barname").value.trim(), footer:$("#footer").value.trim()}); toast("Enregistré."); render(); break;
    case "addcharge": if(!canAdmin()) return; showAddCharge(); break;
    case "savecharge": { if(!canAdmin()) return; const label=$("#clabel").value.trim(), amount=num("camount"), day=$("#cday").value; if(!label||!amount||!day){ toast("Remplissez la nature, le montant et la date."); return; }
      write("set","charges",uid(),{label,amount,day}); toast("Charge ajoutée."); closeModal(); render(); break; }
    case "newprod": if(!canAdmin()) return; showProdEdit(null); break;
    case "export": if(!canAdmin()) return; exportCSV(); break;
    case "syncnew": { if(!canAdmin()) return; lsSet(SYNC_LS, {bar:newBarKey()}); lsSet(SYNCLAST_LS, "1970-01-01T00:00:00Z"); syncStartAll(); toast("Téléphone relié."); render(); break; }
    case "syncjoin": { if(!canAdmin()) return; const k=($("#barkey").value||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,"").replace(/(.{5})(?=.)/g,"$1-"); if(k.length<17){ toast("Le code de liaison a 15 caractères."); return; }
      lsSet(SYNC_LS, {bar:k}); lsSet(SYNCLAST_LS, "1970-01-01T00:00:00Z"); syncQ=[]; lsSet(SYNCQ_LS, syncQ); toast("Récupération des ventes…");
      syncPull().then(()=>{ toast(syncErr ? "Connexion impossible. Vérifiez internet et le code." : "Téléphone relié. Les ventes s'affichent."); render(); }); break; }
    case "syncoff": { if(!canAdmin()) return; if(b.dataset.armed){ lsSet(SYNC_LS, null); toast("Téléphone délié."); render(); } else { b.dataset.armed="1"; b.textContent="Touchez encore pour délier"; } break; }
    case "newappart": if(!canAdmin()) return; showAppartEdit(null); break;
    case "saveappart": { if(!canAdmin()) return; const name=$("#aname").value.trim(), price=num("aprice"); if(!name||!price){ toast("Le nom et le prix de la nuit sont obligatoires."); return; }
      const data={name, dayPrice:price, weekDisc:Math.min(100,num("aweek")||0), monthDisc:Math.min(100,num("amonth")||0)};
      if(modalState.id) write("update","apparts",modalState.id,data); else write("set","apparts",uid(),data);
      toast("Logement enregistré."); closeModal(); render(); break; }
    case "hideappart": if(!canAdmin()) return; write("update","apparts",modalState.id,{hidden:true}); closeModal(); render(); break;
    case "newloc": if(!canCost()) return; showLocEdit(null); break;
    case "saveloc": { if(!canCost()) return; locPreview(); const c=modalState.calc; if(!c){ toast("Vérifiez le logement et les dates."); return; }
      const data={appart:$("#lapp").value, start:$("#lstart").value, end:$("#lend").value, client:$("#lclient").value.trim(), phone:$("#lphone").value.trim(),
        nights:c.nights, dayPrice:S.apparts[$("#lapp").value].dayPrice, base:c.base, pct:c.pct, auto:c.auto, extra:c.extra, total:c.total,
        paid:Math.max(0,num("lpaid")||0), pay:$("#lpay").value, by:role, day:$("#lstart").value};
      if(modalState.id) write("update","locations",modalState.id,data); else write("set","locations",uid(),{...data, created:Date.now()});
      toast("Location enregistrée."); closeModal(); render(); break; }
    case "locedit": { const id=modalState.id; showLocEdit(id); break; }
    case "locpaid": { const l=S.locations[modalState.id]; write("update","locations",modalState.id,{paid:l.total}); toast("Location payée."); showLoc(modalState.id); render(); break; }
    case "locprint": printTicket(locAsTicket(S.locations[modalState.id])); break;
    case "loccancel": { if(!canCost()) return; if(b.dataset.armed){ write("update","locations",modalState.id,{cancelled:true, cancelledAt:Date.now(), cancelledBy:role}); toast("Location annulée."); closeModal(); render(); } else { b.dataset.armed="1"; b.textContent="Touchez encore pour annuler la location"; } break; }
    case "addlcharge": if(!canCost()) return; showAddLCharge(); break;
    case "savelcharge": { if(!canCost()) return; const label=$("#lclabel").value.trim(), amount=num("lcamount"), day=$("#lcday").value; if(!label||!amount||!day){ toast("Remplissez la nature, le montant et la date."); return; }
      write("set","charges",uid(),{label,amount,day,scope:"appart",appart:$("#lcapp").value||null}); toast("Charge ajoutée."); closeModal(); render(); break; }
    case "shiftstart": showShiftStart(false); break;
    case "shiftgo": startShift($("#shiftname").value); break;
    case "saveshift": { if(!canCost()) return; const name=$("#sename").value.trim(), day=$("#seday").value, a=$("#sestart").value, z=$("#seend").value;
      if(!name||!day||!a){ toast("Le prénom, la date et le début sont obligatoires."); return; }
      const [y,mo,dd]=day.split("-").map(Number), at=(hm,plus)=>{ const [hh,mm]=hm.split(":").map(Number); return new Date(y,mo-1,dd+(plus||0),hh,mm).getTime(); };
      const start=at(a); let end=z?at(z):null; if(end!=null && end<=start) end=at(z,1);
      write("update","shifts",modalState.id,{name,start,end,day,editedBy:role,editedAt:Date.now()}); toast("Service corrigé."); closeModal(); render(); break; }
    case "delshift": { if(!canCost()) return; if(b.dataset.armed){ write("update","shifts",modalState.id,{deleted:true,editedBy:role,editedAt:Date.now()}); toast("Service supprimé."); closeModal(); render(); } else { b.dataset.armed="1"; b.textContent="Touchez encore pour supprimer"; } break; }
    case "pickprinter": native({type:"listPrinters"}); break;
    case "testprint": printTicket({no:"TEST", ts:Date.now(), items:[{qty:1,name:"Test d'impression éàç",price:700}], total:700, pay:"Espèces", received:1000, change:300}); break;
  }
});
document.addEventListener("change", e=>{ if(["lapp","lstart","lend"].includes(e.target.id)) locPreview(); if(e.target.id==="autoprint"){ try{ localStorage.setItem("caisse-bar.autoprint", e.target.checked?"1":"0"); }catch(_){} } });
document.addEventListener("input", e=>{
  if(e.target.id==="recv") updRendu();
  if(["lapp","lstart","lend","lextra"].includes(e.target.id)) locPreview();
  if(e.target.id==="disc") setDiscount(+e.target.value);
  if(e.target.id==="pprice"||e.target.id==="pcost"){ const p=+($("#pprice").value||0), c=+($("#pcost").value||0); $("#peur").textContent = eur(p) + (c?` · marge ${fcfa(p-c)} par unité`:""); }
});
window.addEventListener("online", flush);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) lock(); });
["click","input"].forEach(ev=>document.addEventListener(ev, ()=>{ if(role!=="staff") bumpIdle(); }, true));
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) flush(); });
setInterval(()=>{ if(queue.length) flush(); }, 20000);

/* ---------- démarrage ---------- */
loadLocal(); render(); setSync();
function askShiftOnOpen(){ // téléphone de caisse : proposer le début de service si personne n'est en service
  let dev = false; try{ dev = localStorage.getItem(SHIFTDEV_LS)==="1"; }catch(e){}
  if(dev && !openShifts().length && role==="staff" && $("#modal").hidden) showShiftStart(true);
}
setTimeout(askShiftOnOpen, 1500);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) setTimeout(askShiftOnOpen, 800); });
(async()=>{
  for(let i=0;i<30 && !window.claude;i++) await new Promise(r=>setTimeout(r,100));
  try{ db = window.claude ? await window.claude.use("db") : null; }catch(e){ db = null; }
  if(db){ subscribe(); flush(); } else { setSync(); if(syncCfg()){ syncFlush(); syncPull(); } }
  setInterval(()=>{ if(!db && syncCfg()){ syncFlush(); syncPull(); } }, 20000);
  document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && !db && syncCfg()) syncPull(); });
})();
</script>
