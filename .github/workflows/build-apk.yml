name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: node build-html.js
        env:
          ADMIN_PIN_HASH: ${{ secrets.ADMIN_PIN_HASH }}
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk caisse-du-bar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: caisse-du-bar-apk
          path: caisse-du-bar.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Caisse du Bar 1.0.${{ github.run_number }}
          files: caisse-du-bar.apk
